# dsh-model-fallback 的 bundle 补丁：挂载模型自动降级插件。
#
# 该 bundle 出现在 profile 的 dsh.profile.bundles 列表时生效。
# 主机半身监听 llm/stream 瀑布流，按请求做「首选/备用」路由与健康监控。
#
# 这一行必须自带完整 config：插件页的配置表单绑定的是「本行声明的配置」，
# 只有写了 config，Host 才会给这一页一个可写的表单（否则页面显示不可写）。
# 用户后续在设置页保存的改动会覆盖到 profile 的 cordis.patch.yml，不会改这里。
# 首选/备用模型默认留空：必须把 primaryProvider / primaryModels /
# fallbackProvider / fallbackModel 全部填好，插件才会生效（否则等同于未启用）。

- insert:
    - id: dsh-model-fallback
      name: dsh-model-fallback
      config:
        enabled: true
        primaryProvider: ""
        primaryModels: []
        fallbackProvider: ""
        fallbackModel: ""
        timeoutMs: 10000
        windowMs: 30000
        minTokensPerSecond: 30
        switchBackAfterMs: 600000
        asciiTokenPerChar: 0.3
        cjkTokenPerChar: 0.6
        logFile: ""
